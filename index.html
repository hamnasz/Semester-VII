<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semester VII</title>
<meta name="description" content="Notes, slides, papers and project files for Semester VII, searchable and readable right in the browser.">
<meta name="theme-color" content="#f2f4f2" data-dynamic>
<link rel="icon" href="portal/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="portal/css/tokens.css">
<link rel="stylesheet" href="portal/css/base.css">
<link rel="stylesheet" href="portal/css/components.css">
<link rel="stylesheet" href="portal/css/viewers.css">
<link rel="stylesheet" href="portal/css/pdf-text-layer.css">
<script>
  (function () {
    try {
      var raw = localStorage.getItem('sem7.theme');
      var stored = raw ? JSON.parse(raw) : null;
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    } catch (e) { /* private mode or similar: fall through to CSS default */ }
  })();
</script>
</head>
<body>
  <noscript>This portal needs JavaScript enabled to browse and preview files.</noscript>
  <script type="module" src="portal/js/app.js"></script>
</body>
</html>
